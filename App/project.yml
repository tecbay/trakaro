name: Trackaro
options:
  bundleIdPrefix: app.trackaro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TrackaroCore:
    path: ..
targets:
  Trackaro:
    type: application
    platform: macOS
    sources:
      - path: Trackaro
    info:
      path: Trackaro/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.trackaro.Trackaro
            CFBundleURLSchemes: [trackaro]
    dependencies:
      - package: TrackaroCore
        product: TrackaroCore
      - package: TrackaroCore
        product: TrackaroKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trackaro.Trackaro
        PRODUCT_NAME: Trackaro
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Trackaro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
